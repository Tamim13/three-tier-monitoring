global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'backend_api'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'database'
    static_configs:
      - targets: ['localhost:9187']
